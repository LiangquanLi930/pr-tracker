name: Track My PRs

on:
  # 每天 UTC 时间 1:00 运行 (北京时间 9:00)
  schedule:
    - cron: '0 1 * * *'

  # 允许手动触发
  workflow_dispatch:

# 需要写权限来提交报告
permissions:
  contents: write

jobs:
  track-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          type -p gh >/dev/null || {
            type -p curl >/dev/null || (sudo apt update && sudo apt-get install curl -y)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
            && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y
          }

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Generate PR Report
        env:
          # 使用 Personal Access Token 以支持跨仓库 PR 搜索
          # 如果没有设置 GH_PAT，则回退到 GITHUB_TOKEN（仅限当前仓库）
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # 确保 reports 目录存在
          mkdir -p reports

          # 设置输出文件
          OUTPUT_FILE="reports/my-open-prs-$(date +%Y-%m-%d).md"
          LATEST_LINK="reports/latest.md"

          # 获取当前用户
          GITHUB_USER=$(gh api user --jq '.login')
          echo "Tracking PRs for user: $GITHUB_USER"

          # 创建 markdown 文件头部
          cat > "${OUTPUT_FILE}" << EOF
          # Open Pull Requests for @${GITHUB_USER}

          **Generated:** $(date '+%Y-%m-%d %H:%M:%S %Z')

          ---

          EOF

          # 获取所有 open PRs
          echo "Fetching open PRs..."
          PRS=$(gh search prs \
              --author="${GITHUB_USER}" \
              --state=open \
              --json number,title,url,repository,createdAt,updatedAt \
              --limit 100)

          # 计算 PR 数量
          PR_COUNT=$(echo "$PRS" | jq '. | length')
          echo "Found $PR_COUNT open PRs"

          if [ "$PR_COUNT" -eq 0 ]; then
              cat >> "${OUTPUT_FILE}" << EOF
          ## No open pull requests found

          You don't have any open pull requests at this time.
          EOF
          else
              # 获取唯一的仓库列表
              REPOS=$(echo "$PRS" | jq -r '.[].repository.nameWithOwner' | sort -u)
              REPO_COUNT=$(echo "$REPOS" | wc -l | tr -d ' ')

              cat >> "${OUTPUT_FILE}" << EOF
          ## Summary

          - **Total Open PRs:** ${PR_COUNT}
          - **Repositories:** ${REPO_COUNT}
          - **User:** @${GITHUB_USER}

          ---

          EOF

              # 处理每个仓库
              echo "$REPOS" | while IFS= read -r repo; do
                  REPO_PRS=$(echo "$PRS" | jq --arg repo "$repo" '[.[] | select(.repository.nameWithOwner == $repo)]')
                  REPO_PR_COUNT=$(echo "$REPO_PRS" | jq '. | length')

                  cat >> "${OUTPUT_FILE}" << REPOEOF
          ## 📦 ${repo} (${REPO_PR_COUNT} PRs)

          REPOEOF

                  # 处理该仓库的每个 PR
                  echo "$REPO_PRS" | jq -r '.[] | @json' | while IFS= read -r pr; do
                      REPO=$(echo "$pr" | jq -r '.repository.nameWithOwner')
                      NUMBER=$(echo "$pr" | jq -r '.number')
                      TITLE=$(echo "$pr" | jq -r '.title')
                      URL=$(echo "$pr" | jq -r '.url')
                      CREATED=$(echo "$pr" | jq -r '.createdAt')
                      UPDATED=$(echo "$pr" | jq -r '.updatedAt')

                      # 格式化日期
                      CREATED_DATE=$(date -d "$CREATED" "+%Y-%m-%d %H:%M" 2>/dev/null || echo "$CREATED")
                      UPDATED_DATE=$(date -d "$UPDATED" "+%Y-%m-%d %H:%M" 2>/dev/null || echo "$UPDATED")

                      # 获取详细的 PR 信息（review 和 CI 状态）
                      PR_DETAILS=$(gh pr view "$NUMBER" --repo "$REPO" --json reviewDecision,statusCheckRollup 2>/dev/null || echo '{}')

                      REVIEW_DECISION=$(echo "$PR_DETAILS" | jq -r '.reviewDecision // "PENDING"')

                      # 确定 review 状态 emoji
                      case "$REVIEW_DECISION" in
                          "APPROVED")
                              REVIEW_STATUS="✅ Approved"
                              ;;
                          "CHANGES_REQUESTED")
                              REVIEW_STATUS="🔴 Changes Requested"
                              ;;
                          "REVIEW_REQUIRED")
                              REVIEW_STATUS="⏳ Review Required"
                              ;;
                          *)
                              REVIEW_STATUS="⏳ Pending Review"
                              ;;
                      esac

                      # 获取 CI 状态
                      CI_STATE=$(echo "$PR_DETAILS" | jq -r '.statusCheckRollup // [] | if length == 0 then "UNKNOWN" else (map(.state) | if any(. == "FAILURE" or . == "ERROR") then "FAILURE" elif any(. == "PENDING") then "PENDING" elif all(. == "SUCCESS") then "SUCCESS" else "UNKNOWN" end) end')

                      case "$CI_STATE" in
                          "SUCCESS")
                              CI_BADGE="✅ Passing"
                              ;;
                          "FAILURE"|"ERROR")
                              CI_BADGE="❌ Failed"
                              ;;
                          "PENDING")
                              CI_BADGE="🟡 Pending"
                              ;;
                          *)
                              CI_BADGE="⚪ No CI"
                              ;;
                      esac

                      # 写入 PR 条目到 markdown
                      cat >> "${OUTPUT_FILE}" << PREOF
          ### [#${NUMBER}](${URL}) ${TITLE}

          | | |
          |---|---|
          | 📝 **Review Status** | ${REVIEW_STATUS} |
          | 🔧 **CI Status** | ${CI_BADGE} |
          | 📅 **Created** | ${CREATED_DATE} |
          | 🔄 **Last Updated** | ${UPDATED_DATE} |

          PREOF
                  done

                  cat >> "${OUTPUT_FILE}" << EOF

          ---

          EOF
              done
          fi

          # 创建/更新最新报告的符号链接
          ln -sf "$(basename ${OUTPUT_FILE})" "${LATEST_LINK}"

          echo "Report generated: ${OUTPUT_FILE}"

      - name: Commit and Push Report
        run: |
          git add reports/

          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update PR tracking report - $(date +%Y-%m-%d)"
          git push

      - name: Summary
        run: |
          echo "✅ PR tracking report generated and committed successfully!"
          echo "📄 Report: reports/my-open-prs-$(date +%Y-%m-%d).md"
          echo "🔗 Latest: reports/latest.md"