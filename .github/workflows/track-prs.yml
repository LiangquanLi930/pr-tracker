name: Track My PRs

on:
  # 每天 UTC 时间 1:00 运行 (北京时间 9:00)
  schedule:
    - cron: '0 1 * * *'

  # 允许手动触发
  workflow_dispatch:

# 需要写权限来提交报告
permissions:
  contents: write

jobs:
  track-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          type -p gh >/dev/null || {
            type -p curl >/dev/null || (sudo apt update && sudo apt-get install curl -y)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
            && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y
          }

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Pull Latest Changes
        run: git pull --rebase origin main

      - name: Generate PR Report
        env:
          # 使用 Personal Access Token 以支持跨仓库 PR 搜索
          # 如果没有设置 GH_PAT，则回退到 GITHUB_TOKEN（仅限当前仓库）
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: ./track-my-prs.sh

      - name: Commit and Push Report
        run: |
          git add reports/

          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update PR tracking report - $(date +%Y-%m-%d)"
          git push

      - name: Summary
        run: |
          echo "✅ PR tracking report generated and committed successfully!"
          echo "📄 Report: reports/my-open-prs-$(date +%Y-%m-%d).md"
          echo "🔗 Latest: reports/latest.md"

  track-review-requests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          type -p gh >/dev/null || {
            type -p curl >/dev/null || (sudo apt update && sudo apt-get install curl -y)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
            && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y
          }

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Pull Latest Changes
        run: git pull --rebase origin main

      - name: Generate Review Requests Report
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: ./track-review-requests.sh

      - name: Commit and Push Report
        run: |
          git add reports/

          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update review requests report - $(date +%Y-%m-%d)"
          git push

      - name: Summary
        run: |
          echo "✅ Review requests report generated and committed successfully!"
          echo "📄 Report: reports/review-requests-$(date +%Y-%m-%d).md"
          echo "🔗 Latest: reports/review-requests-latest.md"